# ChatLPT deployment: the payment stack (Batteries + node remote signer), builder-core's discovery service
# and the app. See README.md#deploy and docs/references/payment-stack.md. Orchestrators exist on the
# network; the discovery service lists the ones in config/orchestrators.txt and the signer only signs.
# Upstream images are built by scripts/build-images.sh from the pinned commits (D9).
name: chatlpt

services:
  clearinghouse:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}chatlpt/clearinghouse:ca09e47
    build:
      context: https://github.com/NE-Build-Track/clearinghouse-batteries.git#ca09e47c067682fb48c3f15425546fb6aa5b6659
      dockerfile: examples/compose/Dockerfile
    command: [serve, --config-file, /etc/clearinghouse.toml]
    volumes:
      - paid-state:/data
      - ./config/clearinghouse.toml:/etc/clearinghouse.toml:ro
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8081/readyz]
      interval: 5s
      retries: 12
    restart: unless-stopped

  signer:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}chatlpt/node:406b248
    build:
      context: https://github.com/NE-Build-Track/node.git#406b248f6cb8728e6e7eba1809901f589060bc6b
      dockerfile: docker/Dockerfile
    user: "0:0"  # dev only: lets the container read bind-mounted secrets regardless of host uid
    network_mode: service:clearinghouse  # Kafka and the webhook listen on this namespace's loopback
    entrypoint: ["/usr/local/bin/livepeer-signer"]
    command: [--data-dir, /data/node, --config, /etc/signer.toml]
    volumes:
      - paid-state:/data
      - ./config/signer.toml:/etc/signer.toml:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      clearinghouse:
        condition: service_healthy
    restart: unless-stopped

  # builder-core's discovery service (`lpb discovery`, builder-core D43) at the commit the app pins (D2):
  # the static directory in config/orchestrators.txt; the embedded engine reads its GET /discovery.
  discovery:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}chatlpt/discovery:985f23d
    build:
      context: https://github.com/NE-Build-Track/livepeer-builder-core.git#985f23d4da7646b76a99810e94af8019011d2bb2
      dockerfile: deploy/dev-stack/engine/Dockerfile
      args:
        BUILDKIT_CONTEXT_KEEP_GIT_DIR: "1"  # hatch-vcs derives the version from .git
    command: [lpb, discovery]
    environment:
      LPD_ORCHESTRATORS: /etc/lpd/orchestrators.txt
      LPD_HTTP_HOST: 0.0.0.0
    volumes: [./config/orchestrators.txt:/etc/lpd/orchestrators.txt:ro]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8939/healthz')"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  chatlpt:
    image: ${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}chatlpt/chatlpt:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      CHATLPT_HTTP_HOST: 0.0.0.0
      CHATLPT_HTTP_PORT: "3050"
      CHATLPT_DATABASE_URL: sqlite+aiosqlite:////data/chatlpt.db
      CHATLPT_STATIC_DIR: /app/web/dist
      CHATLPT_IMAGES_DIR: /data/images
      CHATLPT_IMAGE_PRICING_FILE: /app/config/pricing/fal-flux-schnell.json
      LPB_DATABASE_URL: sqlite+aiosqlite:////data/livepeer-builder.db
      LPB_HTTP_HOST: 127.0.0.1
      LPB_DISCOVERY_URL: http://discovery:8939/discovery  # runners; the signer only signs (builder-core D43)
    ports: ["127.0.0.1:${CHATLPT_PORT:-3050}:3050"]
    volumes: [chatlpt-data:/data]
    depends_on: [signer, discovery]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3050/healthz')"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  chatlpt-data:
  paid-state:
