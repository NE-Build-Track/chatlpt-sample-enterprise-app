[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chatlpt"
version = "0.1.0"
description = "ChatLPT: a ChatGPT-style sample enterprise app on the livepeer-builder engine (embedded mode)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Mike Zupper" }]
dependencies = [
    "pydantic[email]>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "itsdangerous>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "httpx>=0.27",
    # D2: tasks/mz/intent-before-signing at cf19831, PR #64 head (D54 manifest stored before signing).
    # (docs/design-docs/decisions.md). Re-pin to releases/m3 once that pull request merges.
    "livepeer-builder @ git+https://github.com/NE-Build-Track/livepeer-builder-core.git@cf1983155c9cf87f114d0f5f126dde86c05b23c3",
]

[project.scripts]
chatlpt = "chatlpt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.wheel]
packages = ["src/chatlpt"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "T20", "S", "PT"]
ignore = ["S101"]  # assert is how pytest checks

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PT018", "E501"]
"src/chatlpt/cli.py" = ["T201"]  # the CLI prints its results
"deploy/**" = ["T201", "S603", "S607"]  # operator scripts print and run docker
"scripts/**" = ["T201"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["chatlpt"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["authlib", "authlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["chatlpt"]
concurrency = ["greenlet", "thread"]
omit = ["src/chatlpt/store/migrations/env.py"]

[tool.coverage.report]
fail_under = 95  # ratcheted floor for the whole package; per-layer floors in scripts/check_coverage.py
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "^\\s*\\.\\.\\.$", "@overload"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:authlib.*"]
